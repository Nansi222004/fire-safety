<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E31E24"/>
      <stop offset="50%" stop-color="#C6151B"/>
      <stop offset="100%" stop-color="#8B0A0F"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3D00"/>
      <stop offset="50%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Shield Base -->
  <path d="M32 3 C44 3 56 7 56 18 C56 40 42 55 32 61 C22 55 8 40 8 18 C8 7 20 3 32 3 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#dropShadow)" />

  <!-- Shield Inner Border -->
  <path d="M32 6 C42 6 52 9.5 52 19 C52 38 40 51.5 32 57 C24 51.5 12 38 12 19 C12 9.5 22 6 32 6 Z" 
        fill="none" 
        stroke="url(#innerGlow)" 
        stroke-width="1.5" />

  <!-- Dynamic Fire Flame Element -->
  <path d="M32 15 C33.5 20 38 23 38 28 C38 31.5 35.5 34 32 34 C28.5 34 26 31.5 26 28 C26 25 28 22 30 19 C30 22 32 24 33 24 C33.5 24 34 23.5 34 23 C34 20 32 15 32 15 Z" 
        fill="url(#flameGrad)" />

  <!-- Main Flame -->
  <path d="M32 20 C36 25 43 29 43 37 C43 44.5 38 50 32 50 C26 50 21 44.5 21 37 C21 30 27 25 30 22 C29 26 31 29 33.5 29 C34.5 29 35.5 28 35.5 27 C35.5 24 32 20 32 20 Z" 
        fill="url(#flameGrad)" />

  <!-- Inner Spark -->
  <path d="M32 35 C34.5 38 37 41 37 44 C37 47.5 34.5 49 32 49 C29.5 49 27 47.5 27 44 C27 41 29.5 38 32 35 Z" 
        fill="#FFF9C4" 
        opacity="0.9" />
</svg>
